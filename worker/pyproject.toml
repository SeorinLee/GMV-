[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gmv-worker"
version = "0.1.0"
description = "TikTok Shop Affiliate GMV automation worker (Excel + Playwright US Chrome / UK Edge)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "playwright>=1.44",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
portable = [
    "pyinstaller>=6.16,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# UP042: spec §5 explicitly mandates `class X(str, Enum)`; keep that pattern.
ignore = ["UP042"]
